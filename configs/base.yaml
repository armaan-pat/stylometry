# Base config — shared defaults for all experiments.
# Experiment files only need to override what differs from these values.

encoder:
  name: hf
  model_name_or_path: roberta-base
  pooling: mean
  lora: null
  freeze_backbone: true
  max_length: 512

loss:
  name: supcon
  temperature: 0.07
  margin: 0.3
  mining: batch_hard

head:
  name: prototypical
  distance: cosine
  shrinkage: ledoit_wolf

data:
  dataset: enron
  train_senders: 100
  emails_per_sender_k: 16
  val_split: 0.1
  preprocessing:
    strip_quoted: true
    strip_signatures: true
    strip_boilerplate: true
    entity_masking: false
    fix_encoding: true
    # Sanity floors only — keep short emails so training data covers them.
    min_body_chars: 20
    min_body_words: 5
    min_alnum_ratio: 0.60
    max_body_chars: 4000

# CentroidProbe sizing (inference-style validation run each epoch).
# Expanded 2026-06-09 from 30×4/200/200: the old probe's noise floor (±0.13
# tpr1 CIs) was wider than most candidate improvements. Override per-experiment
# if epoch time matters more than metric resolution.
probe:
  n_profile_senders: 60
  n_enroll_per_sender: 8
  n_query_per_sender: 6
  n_other_queries: 600
  n_synthetic_queries: 600
  seed: 0

training:
  epochs: 10
  batch_size: 64
  lr: 2.0e-5
  scheduler: cosine
  warmup_steps: 100
  grad_clip: 1.0
  mixed_precision: true

wandb:
  project: email-fraud-detection
  entity: klconvergence
  tags: []
  notes: ""

runpod: null

confidence_tiers:
  "1-4": low
  "5-9": medium
  "10-24": high
  "25+": very_high
