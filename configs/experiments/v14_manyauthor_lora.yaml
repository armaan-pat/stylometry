# V14 (LoRA) — IDENTITY EXPANSION: the v12 authorship recipe trained on 844 authors
# (Enron 44 + Blog Authorship Corpus 800), up from 44.
#
# Motivation (docs/v14_validation_results.md): the real bottleneck is identities, not
# synthetic generators (v13 plateau) or pooling. 44 train senders caps content-invariance
# (too few authors x topics to decorrelate style from topic) and makes low-FPR eval
# untrustworthy (6 test senders). v14 adds ~800 blog authors to TRAINING. Both cheap
# drop-in pivots failed validation (zero-shot detector ~chance on imitations; off-the-shelf
# StyleDistance < finetuned LUAR), so the path is: improve the authorship backbone itself
# via massive identity diversity.
#
# v14 = v12_multigen_lora recipe EXCEPT:
#   - data.processed_dir -> data/processed/enron_blog (844 authors, sender-disjoint splits)
#   - augmentation.synthetic_path -> null. With no synthetics the loader uses plain
#     PKSampler over ALL 844 authors (SyntheticBalancedSampler would bottleneck the epoch
#     on the 44 synthetic pairs and starve the blog authors). This is a PURE-AUTHORSHIP
#     run: the strategy says authorship (generator-invariant) is the backbone; the
#     synthetic generator-artifact lever plateaued and zero-shot can't catch imitations.
#   - monitor -> pauc/genuine_vs_other_5pct (no synthetic pool to monitor).
#   - epochs -> 100 (PKSampler gives ~52 batches/epoch over 844 senders, ~26x v12's
#     ~2/epoch, so far fewer epochs reach more steps); hard-negative mining off (it is
#     built around synthetic/PK hard pairs; keep the first many-author run clean).
# Eval (separate): blog held-out probe (150 authors), Enron held-out, held-out
# Claude+Gemini generators, PAN cross-topic — vs v12.

encoder:
  model_name_or_path: rrivera1849/LUAR-MUD
  pooling: luar_episode
  freeze_backbone: false
  lora:
    r: 16
    alpha: 32
    target_modules:
      - query
      - value
      - key
    dropout: 0.05
  max_length: 512
  projection_dim: 128
  episode_k: 1
  trust_remote_code: true

loss:
  name: episodic
  temperature: 0.05
  support_k_min: 2
  support_k_max: 6
  supcon_weight: 0.5

head:
  name: prototypical
  score_fn: adaptive_k
  eval_score_fns:
    - linear_z3
    - cosine
    - sigmoid_z
    - z_persender_sigmoid

data:
  processed_dir: data/processed/enron_blog
  train_senders: 800
  emails_per_sender_k: 8
  val_split: 0.1
  test_split: 0.1
  preprocessing:
    strip_signatures: false
    min_body_chars: 20
    min_body_words: 5
  augmentation:
    synthetic_path: null
    n_syn_per_batch: 0
    crop_prob: 0.3
    crop_min_words: 5
    crop_max_words: 60
    register_stratified: false

training:
  epochs: 100
  batch_size: 128
  lr: 2.0e-4
  scheduler: cosine
  warmup_steps: 200
  grad_clip: 1.0
  mixed_precision: true
  monitor: pauc/genuine_vs_other_5pct
  monitor_mode: max
  early_stopping_patience: 0
  early_stopping_min_delta: 1.0e-3
  keep_last_n: 1
  hard_negative_mining:
    enabled: false

wandb:
  name: v14-manyauthor-lora
  tags:
    - luar
    - lora
    - episodic
    - v14
    - many-author
    - blog-corpus
    - identity-expansion
  notes: "V14 LoRA: v12 authorship recipe trained on 844 authors (Enron 44 + Blog 800), no synthetics, PKSampler. Tests identity-expansion lever for content-invariant authorship. Eval on blog/Enron held-out + held-out generators + PAN."
