# V11 (frozen arm) — the V9 recipe on NO-LLM-positive data, LUAR frozen.
#
# Companion to v11_synv1_lora.yaml: identical recipe and data
# (enron_shortmail + enron_synthetic_v1, episodic loss, episode_k=1, batch 128,
# crop aug) but the LUAR-MUD backbone is FROZEN — only the 512->128 projection
# head trains. This is the "how much of V11 is the backbone adapting vs. just a
# better-shaped projection of a fixed LUAR space?" ablation; cf. the V6 frozen
# vs LoRA ablation (v6_luar_frozen.yaml).
#
# With the backbone frozen, the trainable parameter count drops by ~1000x, so
# the projection-only lr is raised to 1e-3 (matching v6_luar_frozen.yaml). The
# episodic loss + crop augmentation still apply — they shape the projection and
# the synthetic-repulsion geometry within the frozen embedding space.

encoder:
  model_name_or_path: rrivera1849/LUAR-MUD
  pooling: luar_episode
  freeze_backbone: true
  lora: null
  max_length: 512
  projection_dim: 128
  episode_k: 1
  trust_remote_code: true

loss:
  name: episodic
  temperature: 0.05
  support_k_min: 2
  support_k_max: 6
  supcon_weight: 0.5

head:
  name: prototypical
  score_fn: adaptive_k
  eval_score_fns:
    - linear_z3
    - cosine
    - sigmoid_z
    - z_persender_sigmoid

data:
  processed_dir: data/processed/enron_shortmail
  train_senders: 100
  emails_per_sender_k: 8
  val_split: 0.1
  test_split: 0.1
  preprocessing:
    strip_signatures: false
    min_body_chars: 20
    min_body_words: 5
  augmentation:
    synthetic_path: data/synthetic/enron_synthetic_v1
    n_syn_per_batch: 4
    crop_prob: 0.3          # length invariance: short real positives via crops
    crop_min_words: 5
    crop_max_words: 60
    # Register invariance from REAL text (LLM-free replacement for v8's
    # cross-register LLM positives) — post-merge canonical v9 recipe.
    register_stratified: true

training:
  epochs: 150
  batch_size: 128
  lr: 1.0e-3
  scheduler: cosine
  warmup_steps: 200
  grad_clip: 1.0
  mixed_precision: true
  monitor: pauc/genuine_vs_synthetic_5pct
  monitor_mode: max
  early_stopping_patience: 0
  early_stopping_min_delta: 1.0e-3
  keep_last_n: 1
  hard_negative_mining:
    enabled: true
    warmup_epochs: 20
    ramp_epochs: 30
    interval: 5
    n_pairs: 20
    max_hard_fraction: 0.5

wandb:
  name: v11-synv1-frozen
  tags:
    - luar
    - frozen
    - projection
    - episodic
    - variable-k
    - crop-augment
    - short-email
    - v11
    - syn-v1
    - no-cross-register
  notes: "V11 frozen: full V9 recipe on syn-v1 (hard-neg only) with LUAR-MUD frozen, projection-only (lr 1e-3). Backbone-adaptation ablation vs v11_synv1_lora."
