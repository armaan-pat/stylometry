# V11 (frozen, NON-EPISODIC) — the SupCon sibling of v11_synv1_frozen.yaml.
#
# Identical to v11_synv1_frozen.yaml in EVERY knob (LUAR FROZEN, projection-only
# lr 1e-3, episode_k=1, batch 128, enron_shortmail + enron_synthetic_v1
# hard-neg-only, crop 0.3, monitor pauc/genuine_vs_synthetic_5pct) EXCEPT the
# loss: episodic -> supcon. Holding episode_k=1 fixed, this changes ONLY the
# objective, so the episodic-arm ↔ this-arm delta isolates the episodic loss's
# contribution under a frozen backbone.

encoder:
  model_name_or_path: rrivera1849/LUAR-MUD
  pooling: luar_episode
  freeze_backbone: true
  lora: null
  max_length: 512
  projection_dim: 128
  episode_k: 1
  trust_remote_code: true

loss:
  name: supcon
  temperature: 0.05

head:
  name: prototypical
  score_fn: adaptive_k
  eval_score_fns:
    - linear_z3
    - cosine
    - sigmoid_z
    - z_persender_sigmoid

data:
  processed_dir: data/processed/enron_shortmail
  train_senders: 100
  emails_per_sender_k: 8
  val_split: 0.1
  test_split: 0.1
  preprocessing:
    strip_signatures: false
    min_body_chars: 20
    min_body_words: 5
  augmentation:
    synthetic_path: data/synthetic/enron_synthetic_v1
    n_syn_per_batch: 4
    crop_prob: 0.3          # length invariance: short real positives via crops
    crop_min_words: 5
    crop_max_words: 60
    # Register invariance from REAL text (LLM-free) — post-merge canonical recipe.
    register_stratified: true

training:
  epochs: 150
  batch_size: 128
  lr: 1.0e-3
  scheduler: cosine
  warmup_steps: 200
  grad_clip: 1.0
  mixed_precision: true
  monitor: pauc/genuine_vs_synthetic_5pct
  monitor_mode: max
  early_stopping_patience: 0
  early_stopping_min_delta: 1.0e-3
  keep_last_n: 1
  hard_negative_mining:
    enabled: true
    warmup_epochs: 20
    ramp_epochs: 30
    interval: 5
    n_pairs: 20
    max_hard_fraction: 0.5

wandb:
  name: v11-synv1-frozen-supcon
  tags:
    - luar
    - frozen
    - projection
    - supcon
    - episode-k1
    - crop-augment
    - short-email
    - v11
    - syn-v1
    - no-cross-register
    - non-episodic
  notes: "V11 frozen NON-EPISODIC: supcon (not episodic) at episode_k=1 on syn-v1, LUAR frozen. Isolates the episodic-loss contribution vs v11_synv1_frozen (only the loss differs)."
