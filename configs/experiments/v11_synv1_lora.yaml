# V11 (LoRA arm) — the V9 recipe trained on NO-LLM-positive data.
#
# The v7->v8 delta bundles two changes that were never isolated: (a) regenerated corpus + quality filter and
# (b) cross-register LLM POSITIVES (syn-v2's 264 emails stored under the real
# sender_id). v8->v9 then added the episodic objective + short-mail distribution.
# Nothing isolates the v8->v9 objective/distribution change from v8's
# cross-register data.
#
# This arm = the full V9 recipe (episodic variable-K' loss, episode_k=1,
# batch 128, short-mail corpus, crop augmentation) but pointed at
# enron_synthetic_v1 — 438 rows, 100% __syn hard-negatives, ZERO cross-register
# positives (cross-register-fraction 0.0). Byte-identical to
# v9_episodic_shortmail.yaml EXCEPT augmentation.synthetic_path.
#
# Read against the lineage's v9 (syn-v2) row: the gap is exactly the
# cross-register-positive contribution; the gap from v7 is the episodic
# objective + short-mail distribution, now cleanly separated.

encoder:
  model_name_or_path: rrivera1849/LUAR-MUD
  pooling: luar_episode
  freeze_backbone: false
  lora:
    r: 16
    alpha: 32
    target_modules:
      - query
      - value
      - key
    dropout: 0.05
  max_length: 512
  projection_dim: 128
  episode_k: 1
  trust_remote_code: true

loss:
  name: episodic
  temperature: 0.05
  support_k_min: 2
  support_k_max: 6
  supcon_weight: 0.5

head:
  name: prototypical
  score_fn: adaptive_k
  eval_score_fns:
    - linear_z3
    - cosine
    - sigmoid_z
    - z_persender_sigmoid

data:
  processed_dir: data/processed/enron_shortmail
  train_senders: 100
  emails_per_sender_k: 8
  val_split: 0.1
  test_split: 0.1
  preprocessing:
    strip_signatures: false
    min_body_chars: 20
    min_body_words: 5
  augmentation:
    synthetic_path: data/synthetic/enron_synthetic_v1
    n_syn_per_batch: 4
    crop_prob: 0.3          # length invariance: short real positives via crops
    crop_min_words: 5
    crop_max_words: 60
    # Register invariance from REAL text (the LLM-free replacement for v8's
    # cross-register LLM positives): each sender's K in-batch emails are picked
    # to span as many of their registers (formal/casual/terse) as possible, so
    # every episode carries genuine same-author cross-register positives. This is
    # the post-merge canonical v9 recipe (configs/experiments/v9_episodic_shortmail.yaml).
    register_stratified: true

training:
  epochs: 150
  batch_size: 128
  lr: 2.0e-4
  scheduler: cosine
  warmup_steps: 200
  grad_clip: 1.0
  mixed_precision: true
  monitor: pauc/genuine_vs_synthetic_5pct
  monitor_mode: max
  early_stopping_patience: 0
  early_stopping_min_delta: 1.0e-3
  keep_last_n: 1
  hard_negative_mining:
    enabled: true
    warmup_epochs: 20
    ramp_epochs: 30
    interval: 5
    n_pairs: 20
    max_hard_fraction: 0.5

wandb:
  name: v11-synv1-lora
  tags:
    - luar
    - lora
    - episodic
    - variable-k
    - crop-augment
    - short-email
    - v11
    - syn-v1
    - no-cross-register
  notes: "V11 LoRA: full V9 recipe (episodic + short-mail + crop) on syn-v1 (hard-neg only, no LLM positives). Isolates the v8->v9 objective/distribution change from v8's cross-register data."
