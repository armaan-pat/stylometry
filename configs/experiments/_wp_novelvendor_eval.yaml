# EVAL-ONLY config: v11_synv1_lora recipe, but the synthetic pool is the
# held-out multi-generator set (GPT-4o-mini / Claude-3.5-Haiku / Llama-3.1-70B /
# Gemini-2.5-Flash). Used to score existing checkpoints (e.g. runs/v11/lora) against
# generators they NEVER trained on (v11 trained on Mistral-7B only). Not a training
# config — only data.augmentation.synthetic_path differs from v11_synv1_lora.yaml.

encoder:
  model_name_or_path: rrivera1849/LUAR-MUD
  pooling: luar_episode
  freeze_backbone: false
  lora:
    r: 16
    alpha: 32
    target_modules:
      - query
      - value
      - key
    dropout: 0.05
  max_length: 512
  projection_dim: 128
  episode_k: 1
  trust_remote_code: true

loss:
  name: episodic
  temperature: 0.05
  support_k_min: 2
  support_k_max: 6
  supcon_weight: 0.5

head:
  name: prototypical
  score_fn: adaptive_k
  eval_score_fns:
    - linear_z3
    - cosine
    - sigmoid_z
    - z_persender_sigmoid

data:
  processed_dir: data/processed/enron_shortmail
  train_senders: 100
  emails_per_sender_k: 8
  val_split: 0.1
  test_split: 0.1
  preprocessing:
    strip_signatures: false
    min_body_chars: 20
    min_body_words: 5
  augmentation:
    synthetic_path: data/synthetic/enron_synthetic_novelvendor
    n_syn_per_batch: 4
    crop_prob: 0.3
    crop_min_words: 5
    crop_max_words: 60
    register_stratified: true

training:
  epochs: 150
  batch_size: 128
  lr: 2.0e-4
  scheduler: cosine
  warmup_steps: 200
  grad_clip: 1.0
  mixed_precision: true
  monitor: pauc/genuine_vs_synthetic_5pct
  monitor_mode: max

wandb:
  name: v12-heldout-claudegemini-eval
  tags:
    - eval-only
    - multigen
    - held-out-generator
    - v12
