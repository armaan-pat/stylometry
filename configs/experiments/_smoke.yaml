# SMOKE-TEST config — NOT a real experiment.
# Mirrors v7_synv2.yaml exactly EXCEPT the knobs that make a run cheap:
#   epochs 150 -> 3, and hard-negative mining ramped to fire inside those 3
#   epochs so the mining code path is exercised. Use only to confirm the
#   train -> probe -> ablate pipeline executes end-to-end before a real launch:
#     WANDB_MODE=disabled python scripts/train.py --config configs/experiments/_smoke.yaml --output-dir runs/_smoke
encoder:
  model_name_or_path: rrivera1849/LUAR-MUD
  pooling: luar_episode
  freeze_backbone: false
  lora:
    r: 16
    alpha: 32
    target_modules:
      - query
      - value
      - key
    dropout: 0.05
  max_length: 512
  projection_dim: 128
  episode_k: 4
  trust_remote_code: true

loss:
  name: supcon
  temperature: 0.05

head:
  name: prototypical
  score_fn: adaptive_k
  eval_score_fns:
    - linear_z3
    - cosine
    - sigmoid_z

data:
  train_senders: 100
  emails_per_sender_k: 8
  val_split: 0.1
  test_split: 0.1
  augmentation:
    synthetic_path: data/synthetic/enron_synthetic_v2
    n_syn_per_batch: 4

training:
  epochs: 3
  batch_size: 64
  lr: 2.0e-4
  scheduler: cosine
  warmup_steps: 200
  grad_clip: 1.0
  mixed_precision: true
  monitor: auc/genuine_vs_synthetic
  monitor_mode: max
  early_stopping_patience: 0
  early_stopping_min_delta: 1.0e-3
  keep_last_n: 1
  hard_negative_mining:
    enabled: true
    warmup_epochs: 1
    ramp_epochs: 1
    interval: 1
    n_pairs: 20
    max_hard_fraction: 0.5

wandb:
  name: _smoke
  tags:
    - smoke
  notes: "smoke test only — do not report"
