# V6 scoring sweep — same training recipe as v6_luar_lora_syn (the best
# performer on the May 28 export) but evaluates every score function in the
# registry at each probe step. The trained model is identical regardless of
# scoring (loss is on embeddings), so a single run gives you side-by-side
# metrics for every candidate scoring rule.
#
# Outputs you'll get under the run dir:
#   scores_final.json   — score arrays under every fn (canonical = linear_z3)
#   probe_raw.json      — (cos_sim, spread) per query for offline replay
#
# Analyze with:
#   python scripts/analyze_thresholds.py runs/v6_luar_lora_syn_scoring/<TS>
#   python scripts/analyze_thresholds.py runs/.../ --compare-all
#   python scripts/analyze_thresholds.py runs/.../ --score-fn sigmoid_z

encoder:
  model_name_or_path: rrivera1849/LUAR-MUD
  pooling: luar_episode
  freeze_backbone: false
  lora:
    r: 16
    alpha: 32
    target_modules:
      - query
      - value
    dropout: 0.05
  max_length: 512
  projection_dim: 128
  episode_k: 4
  trust_remote_code: true

loss:
  name: supcon
  temperature: 0.07

head:
  name: prototypical
  # Canonical score function (used at inference + for the un-prefixed metric
  # keys in W&B). Pick whichever you want to ship.
  score_fn: linear_z3
  # Additional score functions to evaluate every probe step. First entry is
  # canonical (un-prefixed); the rest get a "{fn}/" prefix in W&B logs so
  # nothing collides.
  eval_score_fns:
    - linear_z3
    - linear_z2
    - cosine
    - sigmoid_z
    - neg_z

data:
  train_senders: 100
  emails_per_sender_k: 8
  val_split: 0.1
  test_split: 0.1
  augmentation:
    synthetic_path: data/synthetic/enron_synthetic
    n_syn_per_batch: 2

training:
  epochs: 100
  batch_size: 64
  lr: 2.0e-4
  scheduler: cosine
  warmup_steps: 200
  grad_clip: 1.0
  mixed_precision: true
  monitor: auc/genuine_vs_all
  monitor_mode: max
  early_stopping_patience: 8
  early_stopping_min_delta: 1.0e-3
  keep_last_n: 1
  hard_negative_mining:
    enabled: true
    warmup_epochs: 20
    ramp_epochs: 30
    interval: 5
    n_pairs: 20
    max_hard_fraction: 0.5

wandb:
  name: v6_luar_lora_syn_scoring
  tags:
    - luar
    - lora
    - projection
    - supcon
    - episode-pooling
    - synthetic-hard-negatives
    - scoring-sweep
    - v6-ablation
  notes: "v6_luar_lora_syn recipe with multi-score-fn evaluation. Loss is on embeddings so the model is identical; only the (cos_sim, spread) → score mapping differs across the logged metric groups."
