# V7 — NEW synthetic arm of the syn-v1-vs-syn-v2 comparison.
#
# Identical training recipe to v7_synv1.yaml. The ONLY difference is the
# synthetic dataset:
#   syn-v2 = regenerated with --cross-register-fraction 0.4 (40% cross-register
#            POSITIVES stored under the real sender_id + 60% hard negatives),
#            plus the expanded topic pools and the quality filter. This is the
#            treatment arm — the dataset the CHANGELOG change produces.
# Keep every other knob fixed so the comparison isolates the dataset change.

encoder:
  model_name_or_path: rrivera1849/LUAR-MUD
  pooling: luar_episode
  freeze_backbone: false
  lora:
    r: 16
    alpha: 32
    target_modules:
      - query
      - value
      - key
    dropout: 0.05
  max_length: 512
  projection_dim: 128
  episode_k: 4
  trust_remote_code: true

loss:
  name: supcon
  temperature: 0.05

head:
  name: prototypical
  score_fn: adaptive_k
  eval_score_fns:
    - linear_z3
    - cosine
    - sigmoid_z

data:
  train_senders: 100
  emails_per_sender_k: 8
  val_split: 0.1
  test_split: 0.1
  augmentation:
    synthetic_path: data/synthetic/enron_synthetic_v2
    n_syn_per_batch: 4

training:
  epochs: 150
  batch_size: 64
  lr: 2.0e-4
  scheduler: cosine
  warmup_steps: 200
  grad_clip: 1.0
  mixed_precision: true
  monitor: auc/genuine_vs_synthetic
  monitor_mode: max
  early_stopping_patience: 0
  early_stopping_min_delta: 1.0e-3
  keep_last_n: 1
  hard_negative_mining:
    enabled: true
    warmup_epochs: 20
    ramp_epochs: 30
    interval: 5
    n_pairs: 20
    max_hard_fraction: 0.5

wandb:
  name: v7-synv2
  tags:
    - luar
    - lora
    - supcon
    - episode-pooling
    - v7
    - syn-v2
    - syn-compare
  notes: "V7 syn-compare TREATMENT arm: new cross-register synthetic (cross-register-fraction 0.4)."
