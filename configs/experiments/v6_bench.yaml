# V6 BENCH — the V6 recipe re-run for the v6→v9 lineage benchmark.
#
# Training recipe is byte-for-byte the V6 baseline (v6_luar_lora_syn.yaml):
# LUAR-MUD + LoRA r16 on q/v only, SupCon τ=0.07, n_syn=2, 100 epochs,
# original synthetic dataset. The ONLY differences are measurement-side, so
# its checkpoints/metrics are directly comparable with the v7/v8/v9 arms:
#   - monitor: pauc/genuine_vs_synthetic_5pct (trustworthy checkpoint_best;
#     the old auc monitor peaked at ~epoch 7
#   - head.eval_score_fns: same per-epoch probe metric set as v7+
# Used by scripts/run_lineage_v6_v9.sh; not a new experiment in itself.

encoder:
  model_name_or_path: rrivera1849/LUAR-MUD
  pooling: luar_episode
  freeze_backbone: false
  lora:
    r: 16
    alpha: 32
    target_modules:
      - query
      - value
    dropout: 0.05
  max_length: 512
  projection_dim: 128
  episode_k: 4
  trust_remote_code: true

loss:
  name: supcon
  temperature: 0.07

head:
  name: prototypical
  score_fn: adaptive_k
  eval_score_fns:
    - linear_z3
    - cosine
    - sigmoid_z
    - z_persender_sigmoid

data:
  train_senders: 100
  emails_per_sender_k: 8
  val_split: 0.1
  test_split: 0.1
  augmentation:
    synthetic_path: data/synthetic/enron_synthetic
    n_syn_per_batch: 2

training:
  epochs: 100
  batch_size: 64
  lr: 2.0e-4
  scheduler: cosine
  warmup_steps: 200
  grad_clip: 1.0
  mixed_precision: true
  monitor: pauc/genuine_vs_synthetic_5pct
  monitor_mode: max
  early_stopping_patience: 0
  early_stopping_min_delta: 1.0e-3
  keep_last_n: 1
  hard_negative_mining:
    enabled: true
    warmup_epochs: 20
    ramp_epochs: 30
    interval: 5
    n_pairs: 20
    max_hard_fraction: 0.5

wandb:
  name: lineage-v6
  tags:
    - luar
    - lora
    - supcon
    - episode-pooling
    - v6-recipe
    - lineage
  notes: "Lineage bench arm 1/4: V6 recipe (τ=0.07, n_syn=2, q/v LoRA, 100 ep) with modern monitoring."
