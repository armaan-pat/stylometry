# SMOKE-TEST config — NOT a real experiment.
# Mirrors v11_llm_detector.yaml EXCEPT the knobs that make a run cheap
# (epochs 150 -> 3, mining ramped to fire inside those 3 epochs). Use to
# confirm the llm_detector BCE-head path executes end-to-end, the classifier
# head receives gradients, and checkpoints round-trip with loss_state_dict:
#   WANDB_MODE=disabled python scripts/train.py \
#       --config configs/experiments/_smoke_v11_detector.yaml --output-dir runs/_smoke_v11
# Requires data/processed/enron_shortmail and data/synthetic/enron_synthetic_v1.
encoder:
  model_name_or_path: rrivera1849/LUAR-MUD
  pooling: luar_episode
  freeze_backbone: false
  lora:
    r: 16
    alpha: 32
    target_modules:
      - query
      - value
      - key
    dropout: 0.05
  max_length: 512
  projection_dim: 128
  episode_k: 1
  trust_remote_code: true

loss:
  name: llm_detector
  temperature: 0.05
  supcon_weight: 0.3

head:
  name: prototypical
  score_fn: adaptive_k
  eval_score_fns:
    - linear_z3
    - cosine
    - sigmoid_z
    - z_persender_sigmoid

data:
  processed_dir: data/processed/enron_shortmail
  train_senders: 100
  emails_per_sender_k: 8
  val_split: 0.1
  test_split: 0.1
  preprocessing:
    strip_signatures: false
    min_body_chars: 20
    min_body_words: 5
  augmentation:
    synthetic_path: data/synthetic/enron_synthetic_v1
    n_syn_per_batch: 4
    crop_prob: 0.3
    crop_min_words: 5
    crop_max_words: 60

training:
  epochs: 3
  batch_size: 128
  lr: 2.0e-4
  scheduler: cosine
  warmup_steps: 200
  grad_clip: 1.0
  mixed_precision: true
  monitor: pauc/genuine_vs_synthetic_5pct
  monitor_mode: max
  early_stopping_patience: 0
  early_stopping_min_delta: 1.0e-3
  keep_last_n: 1
  hard_negative_mining:
    enabled: true
    warmup_epochs: 1
    ramp_epochs: 1
    interval: 1
    n_pairs: 20
    max_hard_fraction: 0.5

wandb:
  name: _smoke_v11_detector
  tags:
    - smoke
  notes: "smoke test only — do not report"
